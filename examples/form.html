<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WebC Form</title>
  <link rel="stylesheet" href="../src/webc.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    .layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    #grid { width: 520px; height: 300px; }
    #user-form { width: 460px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; }
    .caption { width: 100%; margin: 4px 0; color: #49454f; font-size: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions button { height: 40px; padding: 0 24px; border: none; border-radius: 20px; font: inherit; font-weight: 500; cursor: pointer; }
    .actions button[type=submit] { background: #6750a4; color: #fff; }
    .actions button[type=reset] { background: transparent; border: 1px solid #79747e; color: #6750a4; }
    pre { background: #f3edf7; padding: 12px; border-radius: 8px; min-height: 3em; }
  </style>
</head>
<body>
  <p>行をクリックすると setValues でフォームに反映されます。「送信」で getValues の結果を表示します（実際の送信はしません）。</p>

  <div class="layout">
    <div id="grid"></div>

    <form id="user-form">
      <div class="row" id="text-row"></div>
      <div class="row" id="select-row"></div>
      <div class="row" id="gender-row"><span class="caption">性別（Radio）</span></div>
      <div class="row" id="period-row"><span class="caption">連絡頻度（ToggleButton）</span></div>
      <div class="row" id="check-row"></div>
      <div class="row" id="note-row"></div>
      <div class="actions">
        <button type="submit">送信</button>
        <button type="reset">リセット</button>
      </div>
    </form>
  </div>

  <h3>getValues</h3>
  <pre id="out"></pre>

  <script src="../src/webc.js"></script>
  <script>
    const depts = new WebC.data.Store({
      data: [
        { id: 1, name: '営業' },
        { id: 2, name: '開発' },
        { id: 3, name: '総務' },
      ],
    });

    // ---- フォーム ----
    new WebC.field.Input({ renderTo: '#text-row', name: 'name', label: '名前', attrs: { required: true, maxlength: 20 } });
    new WebC.field.Input({ renderTo: '#text-row', name: 'age', label: '年齢', type: 'number', attrs: { min: 0, max: 150 } });
    new WebC.field.Input({ renderTo: '#select-row', name: 'email', label: 'メール', type: 'email' });
    new WebC.field.DropDown({ renderTo: '#select-row', name: 'dept', label: '部署', store: depts, valueField: 'id', displayField: 'name' });

    new WebC.field.Radio({ renderTo: '#gender-row', name: 'gender', inputValue: 'm', label: '男性' });
    new WebC.field.Radio({ renderTo: '#gender-row', name: 'gender', inputValue: 'f', label: '女性' });
    new WebC.field.Radio({ renderTo: '#gender-row', name: 'gender', inputValue: 'x', label: 'その他' });

    new WebC.field.ToggleButton({ renderTo: '#period-row', name: 'period', inputValue: 'day', label: '毎日' });
    new WebC.field.ToggleButton({ renderTo: '#period-row', name: 'period', inputValue: 'week', label: '毎週', value: true });
    new WebC.field.ToggleButton({ renderTo: '#period-row', name: 'period', inputValue: 'month', label: '毎月' });

    new WebC.field.Checkbox({ renderTo: '#check-row', name: 'admin', label: '管理者' });
    new WebC.field.Switch({ renderTo: '#check-row', name: 'notify', label: '通知する', value: true });

    new WebC.field.TextArea({ renderTo: '#note-row', name: 'note', label: '備考', rows: 3 });

    // ---- グリッド（行クリック → setValues） ----
    const grid = new WebC.grid.Grid({
      renderTo: '#grid',
      columns: [
        { text: '名前', dataIndex: 'name', width: 120 },
        { text: '年齢', dataIndex: 'age', width: 64 },
        { text: '部署', dataIndex: 'dept', renderer: (id) => depts.findBy('id', id)?.name ?? '' },
        { text: '管理者', dataIndex: 'admin', width: 72, renderer: (v) => (v ? '✓' : '') },
      ],
      store: new WebC.data.Store({
        data: [
          { name: '佐藤 一郎', age: 34, email: 'sato@example.com', dept: 1, gender: 'm', period: 'day', admin: true, notify: true, note: '営業リーダー' },
          { name: '鈴木 花子', age: 28, email: 'suzuki@example.com', dept: 2, gender: 'f', period: 'week', admin: false, notify: false, note: '' },
          { name: '高橋 健', age: 45, email: 'takahashi@example.com', dept: 3, gender: 'x', period: 'month', admin: false, notify: true, note: '在宅勤務' },
        ],
      }),
    });

    const form = document.querySelector('#user-form');
    const out = document.querySelector('#out');

    grid.on('rowclick', (e) => WebC.Lib.setValues(form, e.detail.record));

    // ---- 送信（ブラウザ標準の入力チェックを通ったときだけ submit が来る） ----
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const values = WebC.Lib.getValues(form);
      out.textContent = JSON.stringify(values, null, 2);
      // WebC.Lib.request({ url: '/api/users', method: 'POST', params: values });
    });
  </script>
</body>
</html>
