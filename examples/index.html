<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>WebC DropDown</title>
  <link rel="stylesheet" href="../src/webc.css">
</head>
<body>
  <div id="list"></div>
  <p>value: <span id="out"></span></p>

  <script src="../src/webc.js"></script>
  <script>
    const dropdown = new WebC.field.DropDown({
      renderTo: '#list',
      valueField: 'val',
      displayField: 'name',
      value: '2',
      store: new WebC.data.Store({
        data: [
          { val: '1', name: 'フィールド1' },
          { val: '2', name: 'フィールド2' },
          { val: '3', name: 'フィールド3' }
        ]
      }),
      cls: 'user-dropdown',
    });

    const out = document.querySelector('#out');
    out.textContent = dropdown.getValue();
    dropdown.on('change', (e) => { out.textContent = e.detail.value; });
  </script>
</body>
</html>
